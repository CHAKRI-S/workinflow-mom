name: Renewal Retry Cron

on:
  # Production schedule moved to Coolify Scheduled Tasks.
  # Keep this workflow as a manual fallback only.
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call renewal retry endpoint
        run: |
          curl -sS --fail --max-time 60 --retry 2 --retry-delay 5 \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://mom.workinflow.cloud/api/cron/renewal-retry"
